<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dla Ciebie :)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="start">
        <div class="content">
        

            <h1>hej ❤️</h1>

            <p>
                Kocham Cię BARDZO 
            </p>

            <div class="line"></div>
            <h1>Jesteśmy razem już</h1>
            <p>Każda sekunda z tobą jest najlepszą sekundą w życiu</p>
            
            <div class="timer">
                <div class="time-box">
                    <span class="number" id="days">0</span>
                    <span class="label">dni</span>
                </div>

                <div class="time-box">
                    <span class="number" id="hours">0</span>
                    <span class="label">godzin</span>
                </div>

                <div class="time-box">
                    <span class="number" id="minutes">0</span>
                    <span class="label">minut</span>
                </div>

                <div class="time-box">
                    <span class="number" id="seconds">0</span>
                    <span class="label">sekund</span>
                </div>
            </div>

            <p class="start-date">
                Od 10 stycznia 2026 roku
            </p>

            <p class="small">
                wracaj tu co jakiś czas :)
            </p>
        </div>

        <div class="heart">♡</div>
    </main>
<script>
    const relationshipStart = new Date("2026-01-10T00:00:00");

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");

    function updateRelationshipCounter(){
        const now = new Date();

        const difference = now - relationshipStart;

        if (difference < 0){
            daysElement.textContent = "0";
            hoursElement.textContent = "0";
            minutesElement.textContent = "0";
            secondsElement.textContent = "0";
            return;
        }

            const totalSeconds = Math.floor(difference / 1000);

            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            daysElement.textContent = days;
            hoursElement.textContent = String(hours).padStart(2, "0");
            minutesElement.textContent = String(minutes).padStart(2, "0");
            secondsElement.textContent = String(seconds).padStart(2, "0");

    }

        updateRelationshipCounter();

        setInterval(updateRelationshipCounter, 1000);
</script>
</body>
</html>
